[tool.poetry]
name = "graphbasedsystemrecommendations"
version = "0.1.0"
description = ""
authors = ["kirill <kirill48108@gmail.com>"]
readme = "README.MD"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = "^0.117.1"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
python-arango = "^8.2.3"
redis = "^7.1.0"
celery = "^5.5.3"
pydantic-settings = "^2.12.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
python-multipart = "^0.0.9"



[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
pytest-cov = "^7.0.0"


[tool.poetry.group.lint.dependencies]
black = "^25.11.0"
mypy = "^1.19.0"


[tool.poetry.group.lin.dependencies]
ruff = "^0.14.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]  # базовые ошибки/варнинги, импорты, некоторые best practices
ignore = ["B008"]




[tool.mypy]
python_version = "3.13"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
exclude = ["tests/"]


[tool.coverage.run]
source = ["app"]
omit = [
    # Низкоуровневый слой доступа к БД (тестируем интеграционно через API)
    "app/services/arango.py",
    # Фоновые задачи Celery (инфраструктурный код)
    "app/worker/*",
    # Алгоритмы рекомендаций, проверяемые интеграционно через /recommendations
    "app/services/recommender/cf.py",
    "app/services/recommender/knn.py",
    "app/services/recommender/pr.py",
    "app/services/recommender/hybrid.py",
    "app/services/recommender/popular.py",
    # Вспомогательные сервисы, которые покрыты интеграционно через API
    "app/services/ab.py",
    "app/services/explain.py",
    "app/services/redis_cache.py",
    "app/services/stats.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.coverage.html]
directory = "coverage_html"
title = "Test coverage"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:pydantic_core.*",
]